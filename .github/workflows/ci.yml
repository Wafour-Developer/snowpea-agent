name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync
      - name: pytest
        run: uv run pytest -q

  vendor-integrity:
    name: vendor-integrity
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync
      # The integrity check compares every vendored file against the exact
      # upstream commit, so the reference clone must sit at that SHA.
      - name: clone hermes-agent at the pinned commit
        env:
          HERMES_COMMIT: 8d79c2ff57bba4b07e5b37ed90387b16541aef53
        run: |
          git init --quiet /tmp/hermes-ref
          git -C /tmp/hermes-ref remote add origin https://github.com/NousResearch/hermes-agent
          git -C /tmp/hermes-ref fetch --depth 1 origin "$HERMES_COMMIT"
          git -C /tmp/hermes-ref checkout --quiet FETCH_HEAD
      - name: verify vendored file hashes and patches
        env:
          HERMES_REF: /tmp/hermes-ref
        run: uv run python scripts/verify_vendor_integrity.py

  protocol-check:
    name: protocol-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync
      - name: generated protocol artifacts are up to date
        run: uv run python scripts/gen_protocol.py --check

  sdk-contract:
    name: sdk-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The contract tests drive a real daemon: `uv run python -m snowpea_core`.
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync
      - name: npm ci
        run: npm ci
      - name: build sdk
        run: npm -w sdk run build
      - name: sdk contract tests
        run: npm -w sdk test -- --grep base

  # ---------------------------------------------------------------------------
  # v0.1 end-to-end smoke (plan §7.9, M8 contract §6)
  #
  # Installs the checkout with installer/install.sh --from-checkout and runs the
  # fifteen steps against that install.  No API key: every model call goes to
  # the scripted fake provider.  Steps 10 and 11 need real messenger
  # credentials and stay in the release pipeline.
  # ---------------------------------------------------------------------------

  e2e-ubuntu:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: npm ci
        run: npm ci
      # install.sh installs the Python package; the TUI bundle has to exist
      # first, because the build hook refuses to make a wheel without it.
      - name: build the TUI bundle
        run: npm -w tui run build
      - name: git identity for the fixture repo
        run: |
          git config --global user.email "e2e@snowpea.invalid"
          git config --global user.name "snowpea e2e"
      - name: v01 smoke
        run: bash tests/e2e/v01_smoke.sh --from-checkout

  e2e-macos:
    name: e2e (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: npm ci
        run: npm ci
      - name: build the TUI bundle
        run: npm -w tui run build
      - name: git identity for the fixture repo
        run: |
          git config --global user.email "e2e@snowpea.invalid"
          git config --global user.name "snowpea e2e"
      - name: v01 smoke
        run: bash tests/e2e/v01_smoke.sh --from-checkout

  e2e-windows:
    name: e2e (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: npm ci
        run: npm ci
      - name: build the TUI bundle
        run: npm -w tui run build
      - name: git identity for the fixture repo
        run: |
          git config --global user.email "e2e@snowpea.invalid"
          git config --global user.name "snowpea e2e"
      - name: v01 smoke
        shell: pwsh
        run: tests\e2e\v01_smoke.ps1 -FromCheckout
