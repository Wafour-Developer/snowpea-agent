[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowpea-agent"
version = "0.1.0"
description = "Snowpea — a local-first coding agent with a Python core, an Ink TUI, and a TypeScript SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "snowpea" }]
keywords = ["agent", "llm", "cli", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "websockets>=12",
  "pydantic>=2",
  "aiohttp>=3.9",
  "anthropic>=0.40",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "croniter>=2",
  "ddgs>=9",
  "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/snowpea/snowpea-agent"

[project.scripts]
snowpea = "snowpea_core.cli.main:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "ruff",
  "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["core/snowpea_core"]

[tool.hatch.build.targets.sdist]
include = ["core", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
timeout = 120

[tool.mypy]
python_version = "3.11"
mypy_path = "core"
ignore_missing_imports = true
