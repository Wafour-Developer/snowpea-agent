[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowpea-agent"
dynamic = ["version"]
description = "Snowpea — a local-first coding agent with a Python core, an Ink TUI, and a TypeScript SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "snowpea" }]
keywords = ["agent", "llm", "cli", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "websockets>=12",
  "pydantic>=2",
  "aiohttp>=3.9",
  "anthropic>=0.40",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "croniter>=2",
  "ddgs>=9",
  "asyncssh>=2.14",
  "python-dotenv",
  "mcp>=2.2.0",
  "playwright>=1.62.0",
]

[project.optional-dependencies]
# Pillow is what downscales a pasted screenshot to the 1568px the vision models
# want.  Without it attachments still work — full-size images are passed
# through — so it is an extra rather than a dependency, and the installers add
# it by default (CORE-multimodal).
images = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/snowpea/snowpea-agent"

[project.scripts]
snowpea = "snowpea_core.cli.main:main"
snowpea-core = "snowpea_core.__main__:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "ruff",
  "mypy",
]

# The single source of truth for the version is snowpea_core.__version__;
# `snowpea --version` and the wheel metadata therefore cannot drift (contract §1).
[tool.hatch.version]
path = "core/snowpea_core/__init__.py"

# Copies tui/dist/snowpea-tui.js into the package before the wheel is zipped.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["core/snowpea_core"]
# The bundle is a build output and so is git-ignored; `artifacts` is what keeps
# the build hook's copy from being filtered back out.
artifacts = ["core/snowpea_core/tui/dist/snowpea-tui.js"]

[tool.hatch.build.targets.sdist]
include = ["core", "tests", "installer", "hatch_build.py", "README.md", "LICENSE", "NOTICE"]
# `uv build` builds the wheel out of the sdist, so the sdist has to carry the
# bundle too — otherwise the hook would have nothing to copy in that second pass.
artifacts = ["core/snowpea_core/tui/dist/snowpea-tui.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
timeout = 120

[tool.mypy]
python_version = "3.11"
mypy_path = "core"
ignore_missing_imports = true
# Vendored sources must stay byte-identical to upstream (see docs/vendoring-map.md),
# so they are checked by the integrity script rather than by mypy.
exclude = "core/snowpea_core/vendor/hermes/"

[[tool.mypy.overrides]]
module = "snowpea_core.vendor.hermes.*"
follow_imports = "skip"
ignore_errors = true
