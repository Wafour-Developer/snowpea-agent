# Screen rules for the Cursor agent CLI (cursor-agent).
#
# Portions derived from herdr (https://github.com/herdrdev/herdr), Apache-2.0:
# src/detect/manifests/cursor.toml, version 2026.08.03.1 (herdr commit e8d7d97).
# Regexes are translated from Rust to Python syntax (\p{Alphabetic} ->
# [^\W\d_]); `kind` is a snowpea addition. herdr's evidence dates from
# 2026-08-03; not re-captured against the cursor-agent installed at port time.

id = "cursor"
version = "2026.11.24.1"
upstream_version = "2026.08.03.1"
aliases = ["cursor-agent"]

[[rules]]
id = "write_file_approval"
state = "blocked"
kind = "permission"
priority = 320
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["write to this file?", "proceed (y)"]
any = [
  { contains = ["reject & propose changes"] },
  { contains = ["esc or n or p"] },
  { contains = ["add write("] },
]

[[rules]]
id = "approval_prompt"
state = "blocked"
kind = "permission"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["waiting for approval", "run this command?"], any = [{ contains = ["run (once) (y)"] }, { contains = ["skip (esc or n)"] }] },
  { contains = ["(y) (enter)"] },
  { line_regex = ['(?i)^\s*allow .*\(y\)'] },
  { contains = ["keep (n)"] },
  { contains = ["skip (esc or n)"] },
  { line_regex = ['(?i)^\s*(?:→\s*)?run .*\(y\)'] },
]

[[rules]]
id = "stop_hint_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_working = true
contains = ["ctrl+c to stop"]

[[rules]]
id = "background_task_status_working"
state = "working"
priority = 95
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)\b[1-9][0-9]*\s+background\s+tasks?\b']

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*(⬡|⬢|[⠀-⣿]+)\s+[^\W\d_]+\w*ing\b']
